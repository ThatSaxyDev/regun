<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Regun is a twin-stick survival shooter.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="regun">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="regun-rook.png" sizes="32x32">

  <title>regun</title>
  <link rel="manifest" href="manifest.json?v=rook">


  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <link rel="preload" href="assets/assets/fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <style id="splash-screen-style">
    @font-face {
      font-family: "PressStart2P";
      src: url("assets/assets/fonts/PressStart2P-Regular.ttf") format("truetype");
      font-display: swap;
    }

    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #161B18;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    #splash {
      display: grid;
      justify-items: center;
      gap: 1rem;
      width: min(90vw, 24rem);
      color: #e5ddd1;
      text-align: center;
    }

    #splash img {
      display: block;
      width: min(313px, 60vw, 54vh);
      height: auto;
    }

    .splash-status {
      display: grid;
      justify-items: center;
      gap: 0.75rem;
      font: 0.875rem/1.6 "PressStart2P", monospace;
      text-transform: uppercase;
    }

    .splash-note {
      max-width: 34ch;
      margin: 0;
      font: 0.875rem/1.5 system-ui, sans-serif;
      text-transform: none;
      color: #c3b8ab;
    }

    .splash-track {
      width: 9rem;
      height: 4px;
      overflow: hidden;
      background: #4a4037;
    }

    .splash-track::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: #e1ba78;
      animation: splash-loading 1.4s ease-in-out infinite alternate;
    }

    @keyframes splash-loading {
      from { transform: translateX(0); }
      to { transform: translateX(150%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-track::after {
        animation: none;
        transform: translateX(75%);
      }
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

    window.addEventListener("flutter-first-frame", removeSplashFromWeb, { once: true });
  </script>
</head>
<body>
  <div id="splash" class="center">
    <picture>
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img width="313" height="313" src="splash/img/light-1x.png" alt="">
    </picture>
    <div class="splash-status" role="status">
      <span>Loading game assets…</span>
      <span class="splash-track" aria-hidden="true"></span>
      <p class="splash-note">Your first visit may take longer while Regun downloads game assets.</p>
    </div>
  </div>

  <main id="mobile-download" hidden style="box-sizing:border-box; max-width:30rem; margin:auto; padding:12vh 1.5rem 2rem; text-align:center; font:1rem/1.5 system-ui,sans-serif; color:#e5ddd1">
    <img src="icons/Icon-192.png" width="88" height="88" alt="">
    <h1>Regun</h1>
    <p id="mobile-download-copy" role="status">Finding the mobile download…</p>
    <a id="regun-store" hidden style=" padding:.75rem 1.2rem; background:#e1ba78; color:#161b18; font-weight:bold"></a>
    <button id="mobile-download-retry" hidden type="button">Try again</button>
  </main>
  <script src="platform_bootstrap.js"></script>



</body></html>
