<path d="M350 682v42" stroke="#d3ba7c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="316" y="751" font-size="17" fill="#d4c8ab" font-weight="normal">FRONT</text>
<text x="57" y="803" font-size="17" fill="#d4c8ab" font-weight="normal">1 / 2 face different directions; both sit on the central roof.</text>
<text x="57" y="833" font-size="17" fill="#d4c8ab" font-weight="normal">Dashed bearing circles mean full mechanical 360-degree traverse.</text>
<text x="57" y="863" font-size="17" fill="#d4c8ab" font-weight="normal">Nose panel = sensors. No fixed nose guns.</text>
<text x="720" y="157" font-size="22" fill="#dfc28a" font-weight="bold">FIVE STATIONS / FOUR WEAPON FAMILIES</text>
<text x="726" y="206" font-size="23" fill="#9fbea8" font-weight="bold">1 + 2</text>
<text x="815" y="206" font-size="20" fill="#9fbea8" font-weight="bold">ROTARY TURRETS</text>
<text x="815" y="233" font-size="16" fill="#d4c8ab" font-weight="normal">Independent tracking and bounded bursts.</text>
<text x="726" y="281" font-size="23" fill="#ddbc83" font-weight="bold">3</text>
<text x="815" y="281" font-size="20" fill="#ddbc83" font-weight="bold">HEAVY CANNON</text>
<text x="815" y="308" font-size="16" fill="#d4c8ab" font-weight="normal">Committed shots through a full-traverse mount.</text>
<text x="726" y="356" font-size="23" fill="#b0abc7" font-weight="bold">4</text>
<text x="815" y="356" font-size="20" fill="#b0abc7" font-weight="bold">FLAK BATTERY</text>
<text x="815" y="383" font-size="16" fill="#d4c8ab" font-weight="normal">Short-range, warned fragmentation packets.</text>
<text x="726" y="431" font-size="23" fill="#b18d6c" font-weight="bold">5</text>
<text x="815" y="431" font-size="20" fill="#b18d6c" font-weight="bold">SEEKER BANK</text>
<text x="815" y="458" font-size="16" fill="#d4c8ab" font-weight="normal">Six-cell magazine; two active seekers initially.</text>
<text x="720" y="541" font-size="22" fill="#dfc28a" font-weight="bold">CLEARANCE CONTRACT</text>
<text x="726" y="576" font-size="17" fill="#d4c8ab" font-weight="normal">All gun pivots and bearings stay on top of the hull.</text>
<text x="726" y="605" font-size="17" fill="#d4c8ab" font-weight="normal">Barrels clear pod tops; muzzle, flash and shot share one solve.</text>
<text x="726" y="634" font-size="17" fill="#d4c8ab" font-weight="normal">Temporary hardware interlocks cannot create a rear safe sector.</text>
<text x="726" y="663" font-size="17" fill="#d4c8ab" font-weight="normal">Fire control reserves escape space and a real cooling window.</text>
<text x="720" y="724" font-size="22" fill="#dfc28a" font-weight="bold">CARGO REMAINS BELOW THE DECK</text>
<text x="726" y="758" font-size="17" fill="#d4c8ab" font-weight="normal">Two folded current Walkers on separate underside rails.</text>
<text x="726" y="786" font-size="17" fill="#d4c8ab" font-weight="normal">Candidate scale 67.5%; trial health 50 each.</text>
<text x="726" y="814" font-size="17" fill="#d4c8ab" font-weight="normal">Roof layout must preserve bay volume and downward release.</text>
<text x="720" y="873" font-size="16" fill="#aaa895" font-weight="normal">Schematic is the layout authority; illustration is a styling draft.</text>
</g></svg>
